name: Deploy DEVICE REPAIR to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate realistic hardware renderer
        run: |
          test -s app-realistic.js
          node --check app-realistic.js
          grep -q "RoundedBoxGeometry" app-realistic.js
          grep -q "makeDiscreteGPU" app-realistic.js
          grep -q "makeRAMModule" app-realistic.js
          grep -q "makeMotherboardDesktop" app-realistic.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
