name: Patch tablet hardware only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tablet-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace only buildTablet and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app-realistic.js')
          text = p.read_text(encoding='utf-8')
          start = text.index('function buildTablet(){')
          end = text.index('\nfunction buildLaptop(){', start)
          encoded = ''
          new_func = base64.b64decode(encoded).decode('utf-8')
          patched = text[:start] + new_func + text[end:]
          p.write_text(patched, encoding='utf-8')
          PY
          node --check app-realistic.js
          git config user.name "Amir Saeid Dehghan"
          git config user.email "108151841+saaeiddev@users.noreply.github.com"
          git add app-realistic.js
          git commit -m "Improve tablet hardware visibility only"
          git push origin main
